name: Update WWE PLE Calendar Schedule

on:
  schedule:
    # Runs every Sunday at 00:00 UTC
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-wwe-ics:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Offline Parser Tests
        run: python -m unittest discover -s wwe-ple-updater -p 'test_*.py'

      - name: Run WWE PLE Parser Script
        run: |
          python wwe-ple-updater/parse_wwe_ple.py

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: update wwe_ple_schedule.ics [skip ci]"
          file_pattern: "wwe-ple-updater/wwe_ple_schedule.ics"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
